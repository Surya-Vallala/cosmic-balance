# Supabase pauses free projects after about a week without any activity, and
# the app stops working until someone restores it from the dashboard. This
# makes one tiny read every day so the shared database never goes to sleep.
# Free for public repositories. Run it by hand from the Actions tab any time.
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 3 * * *' # every day at 03:17 UTC (08:47 in India)
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Read one row through the public API
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 20 \
            "https://jwmnmrmocilfrqohhezf.supabase.co/rest/v1/groups?select=id&limit=1" \
            -H "apikey: sb_publishable_f7rutcv_lapGxGvHdeYepg_Y84ugfwH")
          echo "Supabase answered $code"
          test "$code" = 200
